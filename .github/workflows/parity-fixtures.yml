# Weekly freshness check for ALL five browser-parity fixtures — including the two
# the per-PR gate (ci.yml `parity-freshness`) deliberately skips: embedding_parity
# and hybrid_parity re-encode text with the MiniLM model, so regenerating them
# needs the model download and their floats are sensitive to the resolved
# torch/sentence-transformers stack.
#
# The comparison is TOLERANCE-AWARE, not byte-exact (scripts/compare_parity_fixtures.py):
# floats get math.isclose(rel_tol=1e-6, abs_tol=1e-12); ids, ordering, counts, array
# lengths, key sets and types are compared EXACTLY. That is deliberate — a fresh
# environment can legally differ from the committed bytes in low-order digits, and
# `git diff --exit-code` used to sit here and turn that legal difference into a red
# run. Sub-tolerance drift is now absorbed instead of being triaged by a human.
#
# How to read a red run:
#   - Float values outside tolerance (>1e-6 relative): a genuine numeric change, not
#     platform noise. Treat it like a failing test — find what moved.
#   - Result ids or their ORDER changed (including an RRF near-tie flip): real
#     ranking drift on the Python side. Same — a failing test, not a chore.
#   In both cases the report names the exact JSON path and both values, and the
#   regenerated fixtures are uploaded as an artifact. Never widen the tolerance to
#   make this green.
#
# All run: steps use static commands only — no untrusted ${{ github.event.* }}
# input is interpolated anywhere. All uses: refs are pinned to full commit SHAs
# (the same pins as ci.yml).
name: Parity fixtures (weekly freshness)

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate-and-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Pin Python
        working-directory: backend
        run: uv python install 3.13
      - name: Sync
        working-directory: backend
        run: uv sync --group dev
      # Fixed-key cache: only the first run pays the MiniLM download; afterwards the
      # regen scripts read the local Hugging Face cache.
      - name: Cache MiniLM weights (Hugging Face)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/huggingface
          key: hf-minilm-${{ runner.os }}
      - name: Regenerate all parity fixtures (model download included)
        working-directory: backend
        run: |
          uv run python scripts/gen_search_fixture.py
          uv run python scripts/gen_cooccurrence_fixture.py
          uv run python scripts/gen_strategy_fixture.py
          uv run python scripts/gen_embedding_fixture.py
          uv run python scripts/gen_hybrid_fixture.py
      # The regen scripts rewrite the fixtures IN PLACE, so the baseline to compare
      # against is the committed content: `git show HEAD:<path>` (always
      # repo-root-relative, whatever the working directory) into a temp dir. No
      # pnpm/biome step is needed any more — the comparison parses JSON, so
      # formatter reflow cannot produce a false positive the way it could under
      # `git diff`.
      - name: Compare regenerated fixtures to the committed baseline (float tolerance)
        working-directory: backend
        run: |
          fixtures=frontend/packages/edgeproc-browser/src/engine/__fixtures__
          baseline="$(mktemp -d)"
          for name in search_parity cooccurrence_parity strategy_parity embedding_parity hybrid_parity; do
            git show "HEAD:$fixtures/$name.json" > "$baseline/$name.json"
          done
          uv run python scripts/compare_parity_fixtures.py \
            --pair "$baseline/search_parity.json" "../$fixtures/search_parity.json" \
            --pair "$baseline/cooccurrence_parity.json" "../$fixtures/cooccurrence_parity.json" \
            --pair "$baseline/strategy_parity.json" "../$fixtures/strategy_parity.json" \
            --pair "$baseline/embedding_parity.json" "../$fixtures/embedding_parity.json" \
            --pair "$baseline/hybrid_parity.json" "../$fixtures/hybrid_parity.json"
      - name: Upload regenerated fixtures on drift
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: regenerated-parity-fixtures-weekly
          path: frontend/packages/edgeproc-browser/src/engine/__fixtures__/
