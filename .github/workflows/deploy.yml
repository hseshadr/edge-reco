name: Deploy edge-reco.com
on:
  workflow_run:
    workflows: ["Dagger"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-edge-reco-com
  cancel-in-progress: false
jobs:
  deploy:
    name: Dagger deploy + live verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: dagger/dagger-for-github@496f1b3d8b0d823834c13e67cf8a8e08ca3b9602 # v8.4.0
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          version: "0.21.8"
          call: >-
            deploy
            --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN
            --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID
            --github-token=env:GITHUB_TOKEN
