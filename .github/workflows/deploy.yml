# Deploy https://edge-reco.com — Cloudflare Pages (static, backend-free PWA).
#
# AUTO-DEPLOY: runs automatically after the "Dagger" workflow passes on `main`
# (and on manual workflow_dispatch). Missing deployment secrets are a hard
# failure: a green deploy workflow always means a deploy was attempted and its
# public build identity was verified. Secrets required:
#
#   CLOUDFLARE_API_TOKEN    Pages:Edit-scoped API token
#   CLOUDFLARE_ACCOUNT_ID   the Cloudflare account that owns the `edge-reco`
#                           Pages project + the edge-reco.com zone
#
# Production deploys run via pinned wrangler (docs/DEPLOY.md). The guard runs
# before checkout, and the final step verifies the exact source SHA through the
# deployed, no-store `/build.json` artifact. A stale or partial deploy therefore
# cannot be reported as green.
#
# THE DEPLOY TARGET IS RESOLVED AT EXECUTION TIME, NOT FROM THE TRIGGER.
# `workflow_run.head_sha` is the commit that fired this run — a fact that was
# already true minutes ago and may not be true now. On 2026-08-08 three commits
# landed within ~30s, their gate runs finished out of order, and the deploy
# for the OLDEST one ran last and won: edge-reco.com served 295fcaf while main was
# 3eec558, with every single run green. Each run was correct on its own terms; the
# composition was not. So the "Resolve the deploy target" step below reads
# refs/heads/main from the remote at the moment it runs, and everything downstream
# — checkout, wrangler's --commit-hash, and every verify — uses THAT sha.
# Property-tested in backend/tests/unit/test_deploy_target_resolution.py.
# SPA-ONLY: a static `build:pages` artifact (signed catalog copied same-origin
# into dist/bundle) — no R2, no bundle signing key in Dagger. See docs/DEPLOY.md.
#
# One-time prerequisites (outside this workflow, done by a human with wrangler):
#   npx wrangler pages project create edge-reco --production-branch=main
#   + attach edge-reco.com and www.edge-reco.com custom domains (docs/DEPLOY.md)
name: Deploy edge-reco.com

on:
  # Auto-deploy the commit that just passed Dagger on main.
  workflow_run:
    workflows: ["Dagger"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The resolve step asks the Actions API whether main HEAD has a successful Dagger
  # run. Reading workflow runs is `actions: read`; without it that call 403s and
  # the job fails closed (which is correct, but wastes a run).
  actions: read

# Never let two deploys interleave their uploads.
concurrency:
  group: deploy-edge-reco-com
  cancel-in-progress: false

jobs:
  # Only auto-deploy when the triggering Dagger run succeeded on a PUSH TO THIS
  # REPO's main; a manual dispatch is a pass-through.
  #
  # `head_branch == 'main'` is NOT a trust boundary on its own: a fork's default
  # branch is also called `main`, and a fork-PR run reports that name here. This
  # job checks out `workflow_run.head_sha` with CLOUDFLARE_API_TOKEN in scope, so
  # a branch-name-only gate would run fork-authored code (`pnpm install` alone
  # executes it) holding the Cloudflare credential that fronts every site in this
  # portfolio. Pin the triggering run to this repository AND to a push. Mirrors
  # hseshadr/ci .github/workflows/cloudflare-pages-deploy.yml.
  # Property-tested (both polarities) in
  # backend/tests/unit/test_deploy_fork_guard.py.
  deploy:
    name: Build + deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - name: Guard deployment credentials
        working-directory: ${{ github.workspace }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CF_TOKEN CF_ACCOUNT; do
            if [ -z "${!v}" ]; then
              echo "::error::secret behind $v is not configured (see the header of .github/workflows/deploy.yml)"
              missing=1
            fi
          done
          exit "$missing"

      # Read refs/heads/main from the remote NOW. The trigger's head_sha is a
      # statement about the past; this is the branch as it stands at the instant
      # the deploy actually runs. Everything downstream keys off `target_sha`.
      #
      # If main HEAD has not passed Dagger, this deploys NOTHING and exits green: that
      # commit's own deploy fires when Dagger passes. Skipping is safe precisely
      # because cancellation only ever happens when a NEWER run is queued, so a
      # cancelled deploy always has a successor — and the successor re-resolves
      # main HEAD. That is what makes the cancellation harmless rather than
      # load-bearing. (Switching to cancel-in-progress: true would "fix" the
      # ordering by killing a deploy mid-upload; don't.)
      #
      # Every ${{ }} value enters through env: and is read as "$VAR" — nothing is
      # interpolated into the script body, so there is no injection surface.
      - name: Resolve the deploy target from the remote
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          GATE_WORKFLOW: dagger.yml
          TRIGGER_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail

          # git ls-remote speaks the git protocol directly, so this is the ref
          # itself rather than an API's cached view of it.
          target_sha="$(git ls-remote "https://github.com/$REPO" refs/heads/main | cut -f1)"
          if ! printf '%s' "$target_sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::could not resolve refs/heads/main on $REPO (got: '$target_sha')"
            exit 1
          fi
          echo "trigger sha : $TRIGGER_SHA  (fired this run; may already be stale)"
          echo "main HEAD   : $target_sha  (resolved just now, from the remote)"

          green="$(gh api \
            "repos/$REPO/actions/workflows/$GATE_WORKFLOW/runs?head_sha=$target_sha&per_page=30" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')"
          # `[ null -eq 0 ]` is a bash ERROR, not false, and an `if` swallows it
          # into the deploy branch. Refuse anything that is not a count.
          case "$green" in
            '' | *[!0-9]*)
              echo "::error::unreadable Dagger run count for $target_sha: '$green'"
              exit 1
              ;;
          esac

          if [ "$green" -eq 0 ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD $target_sha has no successful Dagger run yet -- DEPLOYING NOTHING. Its own deploy fires when Dagger passes."
            exit 0
          fi

          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          # EXPECTED_SHA is what every verify step below judges against. It is set
          # from the SAME variable the checkout takes, so the two cannot disagree.
          echo "EXPECTED_SHA=$target_sha" >> "$GITHUB_ENV"
          echo "Deploy target: $target_sha ($green successful Dagger run(s))."

      - name: Checkout code
        if: steps.resolve.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # main HEAD as resolved above — NOT the trigger's head_sha.
          ref: ${{ steps.resolve.outputs.target_sha }}

      # Reads the pinned pnpm version from frontend/package.json "packageManager".
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.resolve.outputs.deploy == 'true'
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.resolve.outputs.deploy == 'true'
        with:
          # THE one Node pin (frontend/.nvmrc) — the SAME build Dagger tests on.
          # This previously read a separate `.node-version` (22) while CI ran 24,
          # so the artifact deployed to edge-reco.com was built on a runtime
          # nothing tested against. Pages serves this build as static assets and
          # runs no Node itself, so the build runtime is ours to choose — and the
          # only defensible choice is the one the tests ran on.
          node-version-file: frontend/.nvmrc

      - name: Install workspace
        if: steps.resolve.outputs.deploy == 'true'
        run: pnpm -C frontend install --frozen-lockfile

      # Self-hosted SPA model weights (house standard §8.1b), fetched BEFORE the
      # build. The build's `prebuild` hook verifies
      # them (sha256-pinned, fail-loud), and the built dist/ ships them under
      # /models/ so the live site never touches a model CDN at runtime. Every
      # file is under the Cloudflare Pages 25 MiB single-asset limit (the q8
      # ONNX is ~22.97 MB; pinned by scripts/download-model.test.mjs).
      - name: Fetch self-hosted model weights (idempotent, sha256-verified)
        if: steps.resolve.outputs.deploy == 'true'
        working-directory: frontend/app
        run: node scripts/download-model.mjs

      # The canonical Pages build: vite build with VITE_BASE=/ +
      # VITE_BUNDLE_BASE_URL=bundle, then the committed signed catalog copied
      # same-origin into dist/bundle (zero CORS, zero application backend).
      # Output: frontend/app/dist.
      - name: Build the static SPA (signed bundle copied same-origin)
        if: steps.resolve.outputs.deploy == 'true'
        run: pnpm -C frontend -F frontend run build:pages

      - name: Deploy to Cloudflare Pages
        if: steps.resolve.outputs.deploy == 'true'
        # wrangler reads the API token + account id from the environment.
        # EXPECTED_SHA came from the resolve step via $GITHUB_ENV and is the same
        # sha the checkout above took.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >-
          npx wrangler@4.103.0 pages deploy frontend/app/dist
          --project-name=edge-reco
          --branch=main
          --commit-hash="$EXPECTED_SHA"
          --commit-dirty=false

      - name: Verify deployed source identity
        if: steps.resolve.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/edge-reco/deployments?env=production&per_page=10"
          for attempt in $(seq 1 12); do
            payload=$(curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
            deployed_sha=$(jq -r --arg sha "$EXPECTED_SHA" \
              '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha) | .deployment_trigger.metadata.commit_hash' \
              <<<"$payload" | head -n 1)
            status=$(jq -r --arg sha "$EXPECTED_SHA" \
              '.result[] | select(.deployment_trigger.metadata.commit_hash == $sha) | .latest_stage.status' \
              <<<"$payload" | head -n 1)
            if [ "$deployed_sha" = "$EXPECTED_SHA" ] && [ "$status" = "success" ]; then
              echo "Cloudflare production deployment verified: $deployed_sha"
              exit 0
            fi
            echo "Waiting for Cloudflare deployment: attempt=$attempt sha=${deployed_sha:-missing} status=${status:-missing}"
            sleep 5
          done
          echo "::error::Cloudflare never reported successful deployment_trigger.metadata.commit_hash=$EXPECTED_SHA"
          exit 1

      - name: Verify public build identity
        if: steps.resolve.outputs.deploy == 'true'
        run: |
          for attempt in $(seq 1 12); do
            identity=$(curl --fail-with-body --silent --show-error --max-time 15 \
              https://edge-reco.com/build.json) || identity='{}'
            deployed_sha=$(jq -r '.commit // empty' <<<"$identity")
            if [ "$deployed_sha" = "$EXPECTED_SHA" ]; then
              echo "Public build identity verified: $deployed_sha"
              exit 0
            fi
            echo "Waiting for public build identity: attempt=$attempt sha=${deployed_sha:-missing} expected=$EXPECTED_SHA"
            sleep 5
          done
          echo "::error::public /build.json never reported commit=$EXPECTED_SHA"
          exit 1

      - name: Verify canonical hosts
        if: steps.resolve.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --max-time 15 \
            --output /dev/null https://edge-reco.com/
          readarray -t redirect < <(curl --silent --show-error --max-time 15 \
            --output /dev/null --write-out '%{http_code}\n%{redirect_url}\n' \
            'https://www.edge-reco.com/faq?source=deploy-check')
          status="${redirect[0]:-missing}"
          target="${redirect[1]:-missing}"
          expected='https://edge-reco.com/faq?source=deploy-check'
          if { [ "$status" != "301" ] && [ "$status" != "308" ]; } || \
             [ "$target" != "$expected" ]; then
            echo "::error::www canonical redirect failed: status=$status target=$target expected=$expected"
            exit 1
          fi
          echo "Canonical hosts verified: www redirects to $target ($status)"
