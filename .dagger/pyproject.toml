[project]
name = "edge-reco"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = ["dagger-io"]

[dependency-groups]
dev = [
  "mypy>=1.18.0",
  "pip-audit>=2.9.0",
  "poethepoet>=0.38.0",
  "pytest>=8.4.0",
  "pytest-cov>=7.0.0",
  "radon>=6.0.1",
  "ruff>=0.12.0",
  "xenon>=0.9.3",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
dagger-io = { path = "sdk", editable = true }

[tool.dagger]
base-image = "python:3.13.14-slim@sha256:9662417aace5ae7b8e2609cce472b72a8958e134ba372808abe9cc1a0c0125e6"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C901", "B", "UP", "SIM", "N", "RUF", "ASYNC", "S", "PL"]

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"tests/test_*.py" = ["PLC0415", "PLR2004", "S101"]

[tool.mypy]
strict = true
python_version = "3.13"
warn_unreachable = true
disallow_any_explicit = true

[tool.coverage.run]
branch = true

[tool.poe.tasks]
fmt = { shell = "ruff check --fix src tests && ruff format src tests" }
lint = { shell = "ruff check src tests && ruff format --check src tests" }
typecheck = "mypy --strict src tests"
complexity = "xenon --max-absolute A --max-modules A --max-average A src"
test = "pytest tests --cov=edge_reco --cov-branch --cov-fail-under=90"
branchrate = { shell = "coverage json -o /tmp/edge-reco-dagger-coverage.json && python -c \"import json; data=json.load(open('/tmp/edge-reco-dagger-coverage.json'))['files']; values=[item['summary'] for path,item in data.items() if path.startswith('src/edge_reco/')]; covered=sum(item['covered_branches'] for item in values); total=sum(item['num_branches'] for item in values); assert total and covered * 100 >= total * 90, f'branch coverage {covered}/{total} below floor'\"" }
audit = "pip-audit"
gate = ["lint", "typecheck", "complexity", "test", "branchrate"]
